version: '3.8'

services:
  vinnytsia-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinnytsia_radar_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - radar_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/api/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  radar_data:
    driver: local
