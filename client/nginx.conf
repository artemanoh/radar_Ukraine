server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME type for WebAssembly — required for correct WASM loading
    types {
        application/wasm  wasm;
    }

    # Enable gzip compression for JS/WASM/JSON assets
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: all unknown paths serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets (Vite outputs contenthash in filename)
    location ~* \.(js|css|wasm|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html (ensures SW and app version updates are picked up)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Required headers for SharedArrayBuffer (WASM threads / Atomics)
    add_header Cross-Origin-Opener-Policy  "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
}
